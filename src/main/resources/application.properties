spring.application.name=agent-observability

# ─── Anthropic ───────────────────────────────────────────────────────────────
# Set the ANTHROPIC_API_KEY environment variable before starting the application.
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}

# ─── Tracing ─────────────────────────────────────────────────────────────────
# Sample every request (use a lower value in production, e.g. 0.1)
management.tracing.sampling.probability=1.0

# OTLP HTTP endpoint — points to Jaeger all-in-one (see docker-compose.yml)
management.otlp.tracing.endpoint=http://localhost:4318/v1/traces

# ─── Actuator ────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
